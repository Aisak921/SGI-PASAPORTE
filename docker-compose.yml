services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin "ports": la BD solo es accesible desde la red interna de Docker.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUDIO_DIR: /data/audio
    volumes:
      - audio:/data/audio
      - ./data:/srv/data # CSV de inventario editable sin reconstruir la imagen
      # Carpeta local sincronizada por el cliente de OneDrive (Windows: OneDrive Desktop ya la trae;
      # Linux: cliente libre https://github.com/abraunegg/onedrive). Ajusta la ruta del host a la izquierda.
      - ${ONEDRIVE_LOCAL_FOLDER:-./onedrive}:/data/onedrive
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUDIO_DIR: /data/audio
    volumes:
      - audio:/data/audio
      - ${ONEDRIVE_LOCAL_FOLDER:-./onedrive}:/data/onedrive
    ports:
      - "8080:8080"
    command: ["python", "-m", "uvicorn", "app.web:app", "--host", "0.0.0.0", "--port", "8080"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Túnel público ngrok (opcional) ──────────────────────────────────
  # Expone el portal web a internet para que los funcionarios accedan
  # desde datos móviles fuera de la red local.
  # Para activarlo: agrega NGROK_AUTHTOKEN=tu_token en el .env
  # Obtén tu token gratis en: https://dashboard.ngrok.com
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - web
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http web:8080 --log=stdout
    ports:
      - "4040:4040"   # panel de control local: http://localhost:4040
    profiles:
      - ngrok          # solo arranca si ejecutas: docker compose --profile ngrok up -d

volumes:
  pgdata:
  audio:
