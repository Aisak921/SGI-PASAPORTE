<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>Reportar Falla — Oficina de Pasaportes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --azul:       #1e3a8a;
      --azul-m:     #2563eb;
      --azul-c:     #dbeafe;
      --gris-bg:    #f1f5f9;
      --gris-card:  #ffffff;
      --gris-text:  #475569;
      --gris-light: #e2e8f0;
      --verde:      #16a34a;
      --rojo:       #dc2626;
      --radio:      16px;
      --sombra:     0 4px 24px rgba(30,58,138,.12);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%);
      min-height: 100dvh;
    }

    /* ── encabezado ── */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(30,58,138,.92);
      backdrop-filter: blur(10px);
      padding: 14px 20px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: #2563eb; display: grid; place-items: center;
      font-size: 18px; flex-shrink: 0;
    }
    .titulo-header { color: #fff; }
    .titulo-header h1 { font-size: 15px; font-weight: 700; }
    .titulo-header p  { font-size: 12px; opacity: .7; }

    /* ── contenedor principal ── */
    main {
      max-width: 560px; margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* ── burbuja de pregunta ── */
    .burbuja {
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: var(--radio);
      padding: 14px 16px;
      color: #fff;
      font-size: 15px; line-height: 1.5;
      animation: aparece .25s ease;
    }
    .burbuja strong { font-weight: 600; }
    .burbuja .icono { font-size: 20px; margin-right: 6px; }

    /* ── tarjeta de paso ── */
    .paso {
      background: var(--gris-card);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      overflow: hidden;
      animation: aparece .3s ease;
    }
    .paso-titulo {
      background: var(--azul); color: #fff;
      padding: 12px 16px;
      font-size: 13px; font-weight: 600;
      letter-spacing: .02em;
      display: flex; align-items: center; gap: 8px;
    }
    .paso-cuerpo { padding: 14px 16px; }

    /* ── campo de nombre ── */
    .campo-nombre {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .campo-nombre input {
      flex: 1; min-width: 180px;
      padding: 12px 14px;
      border: 2px solid var(--gris-light);
      border-radius: 10px;
      font-size: 16px; font-family: inherit;
      outline: none; transition: border-color .2s;
    }
    .campo-nombre input:focus { border-color: var(--azul-m); }

    /* ── botones de selección ── */
    .grid-botones {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .btn-opcion {
      padding: 12px 10px;
      background: var(--gris-bg);
      border: 2px solid transparent;
      border-radius: 12px;
      font-family: inherit; font-size: 13.5px; font-weight: 500;
      color: #1e293b; cursor: pointer; text-align: center;
      transition: all .15s; line-height: 1.3;
    }
    .btn-opcion:hover  { background: var(--azul-c); border-color: var(--azul-m); }
    .btn-opcion.activo { background: var(--azul);   border-color: var(--azul); color: #fff; }

    /* ── fallas (lista completa) ── */
    .lista-fallas { display: flex; flex-direction: column; gap: 8px; }
    .btn-falla {
      width: 100%;
      padding: 13px 14px;
      background: var(--gris-bg);
      border: 2px solid transparent;
      border-radius: 12px;
      font-family: inherit; font-size: 14px; font-weight: 500;
      color: #1e293b; cursor: pointer; text-align: left;
      transition: all .15s;
    }
    .btn-falla:hover  { background: var(--azul-c); border-color: var(--azul-m); }
    .btn-falla.activo { background: var(--azul);   border-color: var(--azul); color: #fff; }

    /* ── botón primario ── */
    .btn-primario {
      width: 100%; padding: 15px;
      background: var(--azul-m); color: #fff;
      border: none; border-radius: 12px;
      font-family: inherit; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: background .15s, transform .1s;
      margin-top: 14px;
    }
    .btn-primario:hover   { background: var(--azul); }
    .btn-primario:active  { transform: scale(.98); }
    .btn-primario:disabled { opacity: .5; cursor: not-allowed; }

    /* ── botón secundario (pequeño) ── */
    .btn-sec {
      padding: 9px 16px; background: var(--gris-bg);
      border: 1px solid var(--gris-light); border-radius: 8px;
      font-family: inherit; font-size: 13px; color: var(--gris-text);
      cursor: pointer; transition: background .15s;
    }
    .btn-sec:hover { background: var(--gris-light); }

    /* ── input de texto libre ── */
    .input-libre {
      width: 100%; padding: 12px 14px;
      border: 2px solid var(--gris-light); border-radius: 10px;
      font-size: 15px; font-family: inherit; resize: none;
      outline: none; transition: border-color .2s;
      margin-top: 10px; min-height: 80px;
    }
    .input-libre:focus { border-color: var(--azul-m); }

    /* ── grabador de audio ── */
    .audio-wrap {
      margin-top: 10px;
      border: 2px dashed var(--gris-light);
      border-radius: 12px; padding: 14px;
      text-align: center; background: var(--gris-bg);
    }
    .btn-mic {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--azul-m); color: #fff;
      border: none; font-size: 24px; cursor: pointer;
      display: grid; place-items: center;
      transition: background .15s, transform .1s;
      margin: 0 auto 8px;
    }
    .btn-mic:hover { background: var(--azul); }
    .btn-mic.grabando { background: var(--rojo); animation: pulso 1s infinite; }
    .mic-estado { font-size: 13px; color: var(--gris-text); }
    audio { width: 100%; margin-top: 8px; border-radius: 8px; }

    /* ── pantalla de éxito ── */
    .exito {
      background: var(--gris-card);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      padding: 40px 20px;
      text-align: center;
      animation: aparece .4s ease;
    }
    .exito .icono-ok { font-size: 60px; margin-bottom: 16px; }
    .exito h2 { font-size: 22px; font-weight: 700; color: var(--azul); margin-bottom: 8px; }
    .exito p  { color: var(--gris-text); font-size: 15px; line-height: 1.5; }
    .caso-badge {
      display: inline-block;
      background: var(--azul-c); color: var(--azul);
      font-weight: 700; border-radius: 8px;
      padding: 6px 14px; margin: 16px 0; font-size: 18px;
    }

    /* ── indicador de carga ── */
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: giro .7s linear infinite; vertical-align: middle;
    }

    /* ── resumen (paso final) ── */
    .resumen { background: var(--gris-bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 4px; }
    .resumen dt { font-size: 11px; font-weight: 600; color: var(--gris-text); text-transform: uppercase; letter-spacing: .06em; }
    .resumen dd { font-size: 15px; font-weight: 500; color: #1e293b; margin-top: 2px; }

    /* ── oculto ── */
    .oculto { display: none !important; }

    /* ── animaciones ── */
    @keyframes aparece { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes giro    { to { transform: rotate(360deg); } }
    @keyframes pulso   { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,.4); } 50% { box-shadow: 0 0 0 10px transparent; } }
  </style>
</head>
<body>

<header>
  <div class="logo">🛡️</div>
  <div class="titulo-header">
    <h1>Soporte TI</h1>
    <p>Oficina de Pasaportes</p>
  </div>
</header>

<main id="app">
  <!-- Se renderiza por JS -->
</main>

<script>
// ═══════════════════════════════════════════════════════════
// Estado global
// ═══════════════════════════════════════════════════════════
const S = {
  nombre: getCookie('sgi_nombre') || '',
  estacion_id: null, estacion_nombre: '',
  tipo_equipo: '',
  falla: '',
  audio_blob: null, audio_texto: '',
};

// ═══════════════════════════════════════════════════════════
// Utilidades
// ═══════════════════════════════════════════════════════════
function getCookie(name) {
  return document.cookie.split('; ').reduce((v, c) => {
    const [k, val] = c.split('=');
    return k === name ? decodeURIComponent(val) : v;
  }, '');
}
function setCookie(name, value, days = 30) {
  const exp = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${exp};path=/;SameSite=Lax`;
}
function html(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const app = document.getElementById('app');
function render(contenido) {
  app.innerHTML = contenido;
  app.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ═══════════════════════════════════════════════════════════
// Paso 0 — Nombre
// ═══════════════════════════════════════════════════════════
function paso0_nombre() {
  render(`
    <div class="burbuja">
      <span class="icono">👋</span>
      <strong>Hola.</strong> Para reportar una falla de equipo en tu módulo, solo necesito un par de datos.
    </div>
    <div class="paso">
      <div class="paso-titulo">📋 Paso 1 de 4 — ¿Quién eres?</div>
      <div class="paso-cuerpo">
        <p style="color:#475569;font-size:14px;margin-bottom:12px">
          Escribe tu nombre. La próxima vez no te lo volvemos a pedir.
        </p>
        <div class="campo-nombre">
          <input id="inp-nombre" type="text" placeholder="Tu nombre completo"
            value="${html(S.nombre)}" autocomplete="name" autofocus />
          <button class="btn-primario" style="margin-top:0;width:auto;padding:12px 20px"
            onclick="confirmar_nombre()">Continuar →</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('inp-nombre')
    .addEventListener('keydown', e => { if (e.key === 'Enter') confirmar_nombre(); });
}

function confirmar_nombre() {
  const v = document.getElementById('inp-nombre').value.trim();
  if (!v) { alert('Por favor escribe tu nombre.'); return; }
  S.nombre = v;
  setCookie('sgi_nombre', v);
  paso1_estacion();
}

// ═══════════════════════════════════════════════════════════
// Paso 1 — Ubicación / módulo
// ═══════════════════════════════════════════════════════════
async function paso1_estacion() {
  render(`<div class="burbuja"><span class="icono">⏳</span>Cargando ubicaciones…</div>`);
  const ests = await fetch('/api/estaciones').then(r => r.json());
  const bots = ests.map(e =>
    `<button class="btn-opcion" onclick="elegir_estacion(${e.id},'${html(e.nombre)}')">${html(e.nombre)}</button>`
  ).join('');
  render(`
    <div class="burbuja">
      <span class="icono">📍</span> Hola <strong>${html(S.nombre)}</strong>, ¿desde qué módulo o área reportas?
    </div>
    <div class="paso">
      <div class="paso-titulo">📋 Paso 2 de 4 — Ubicación</div>
      <div class="paso-cuerpo">
        <div class="grid-botones">${bots}</div>
        <button class="btn-sec" style="margin-top:12px" onclick="paso0_nombre()">← Cambiar nombre</button>
      </div>
    </div>
  `);
}

function elegir_estacion(id, nombre) {
  S.estacion_id = id; S.estacion_nombre = nombre;
  paso2_tipo();
}

// ═══════════════════════════════════════════════════════════
// Paso 2 — Tipo de equipo
// ═══════════════════════════════════════════════════════════
async function paso2_tipo() {
  const tipos = await fetch('/api/tipos').then(r => r.json());
  const bots = tipos.map(t =>
    `<button class="btn-opcion" onclick="elegir_tipo('${html(t)}')">${html(t)}</button>`
  ).join('');
  render(`
    <div class="burbuja">
      <span class="icono">💻</span> <strong>${html(S.estacion_nombre)}</strong> — ¿Qué equipo está fallando?
    </div>
    <div class="paso">
      <div class="paso-titulo">📋 Paso 3 de 4 — Tipo de equipo</div>
      <div class="paso-cuerpo">
        <div class="grid-botones">${bots}</div>
        <button class="btn-sec" style="margin-top:12px" onclick="paso1_estacion()">← Cambiar ubicación</button>
      </div>
    </div>
  `);
}

function elegir_tipo(tipo) {
  S.tipo_equipo = tipo;
  paso3_falla();
}

// ═══════════════════════════════════════════════════════════
// Paso 3 — Tipo de falla + descripción libre + audio
// ═══════════════════════════════════════════════════════════
async function paso3_falla() {
  const fallas = await fetch(`/api/fallas?tipo=${encodeURIComponent(S.tipo_equipo)}`).then(r => r.json());
  const bots = fallas.map(f =>
    `<button class="btn-falla" onclick="elegir_falla('${html(f)}')">${html(f)}</button>`
  ).join('');
  render(`
    <div class="burbuja">
      <span class="icono">🔧</span> <strong>${html(S.tipo_equipo)}</strong> en ${html(S.estacion_nombre)} — ¿Cuál es el problema?
    </div>
    <div class="paso">
      <div class="paso-titulo">📋 Paso 4 de 4 — Tipo de falla</div>
      <div class="paso-cuerpo">
        <div class="lista-fallas">${bots}</div>

        <p style="font-size:13px;color:#64748b;margin:14px 0 4px;font-weight:600">
          O descríbelo con tus palabras (opcional):
        </p>
        <textarea id="txt-libre" class="input-libre" placeholder="Ej: el escáner hace ruido y no lee el documento…" rows="3"></textarea>

        <div class="audio-wrap">
          <p style="font-size:13px;color:#64748b;margin-bottom:10px">También puedes <strong>grabar un audio</strong> con tu teléfono:</p>
          <button id="btn-mic" class="btn-mic" onclick="alternar_grabacion()" title="Grabar audio">🎤</button>
          <p id="mic-estado" class="mic-estado">Toca para grabar</p>
          <audio id="audio-preview" controls class="oculto"></audio>
        </div>

        <button class="btn-primario" onclick="confirmar_falla()">Enviar reporte →</button>
        <button class="btn-sec" style="display:block;width:100%;margin-top:10px;text-align:center" onclick="paso2_tipo()">← Cambiar equipo</button>
      </div>
    </div>
  `);
  _init_grabacion();
}

let _falla_seleccionada = '';
function elegir_falla(falla) {
  _falla_seleccionada = falla;
  document.querySelectorAll('.btn-falla').forEach(b => b.classList.toggle('activo', b.textContent === falla));
}

// ═══════════════════════════════════════════════════════════
// Grabación de audio
// ═══════════════════════════════════════════════════════════
let _mediaRec = null, _chunks = [];
function _init_grabacion() { /* se inicializa al pulsar */ }

async function alternar_grabacion() {
  if (_mediaRec && _mediaRec.state === 'recording') {
    _mediaRec.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _chunks = [];
    _mediaRec = new MediaRecorder(stream);
    _mediaRec.ondataavailable = e => { if (e.data.size > 0) _chunks.push(e.data); };
    _mediaRec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(_chunks, { type: 'audio/webm' });
      S.audio_blob = blob;
      const url = URL.createObjectURL(blob);
      const preview = document.getElementById('audio-preview');
      preview.src = url; preview.classList.remove('oculto');
      document.getElementById('btn-mic').classList.remove('grabando');
      document.getElementById('mic-estado').textContent = 'Audio listo. Puedes volver a grabar.';

      // Transcribir en background
      try {
        document.getElementById('mic-estado').textContent = 'Transcribiendo…';
        const fd = new FormData();
        fd.append('audio', blob, 'audio.webm');
        const res = await fetch('/api/audio', { method: 'POST', body: fd }).then(r => r.json());
        if (res.ok && res.texto) {
          S.audio_texto = res.texto;
          document.getElementById('txt-libre').value = res.texto;
          document.getElementById('mic-estado').textContent = '✅ Transcripción lista';
        } else {
          document.getElementById('mic-estado').textContent = 'Audio guardado (sin transcripción)';
        }
      } catch { document.getElementById('mic-estado').textContent = 'Audio guardado'; }
    };
    _mediaRec.start();
    document.getElementById('btn-mic').classList.add('grabando');
    document.getElementById('mic-estado').textContent = '🔴 Grabando… toca para detener';
  } catch (e) {
    alert('No se pudo acceder al micrófono. Verifica los permisos del navegador.');
  }
}

// ═══════════════════════════════════════════════════════════
// Confirmación y envío
// ═══════════════════════════════════════════════════════════
async function confirmar_falla() {
  const libre = document.getElementById('txt-libre')?.value.trim() || '';
  S.falla = _falla_seleccionada || libre || S.audio_texto;
  if (!S.falla) { alert('Por favor selecciona o describe la falla.'); return; }
  paso_confirmar();
}

function paso_confirmar() {
  render(`
    <div class="burbuja"><span class="icono">✅</span> Revisa el resumen antes de enviar:</div>
    <div class="paso">
      <div class="paso-titulo">📤 Resumen del reporte</div>
      <div class="paso-cuerpo">
        <dl>
          <div class="resumen"><dt>Funcionario</dt><dd>${html(S.nombre)}</dd></div>
          <div class="resumen" style="margin-top:8px"><dt>Ubicación</dt><dd>${html(S.estacion_nombre)}</dd></div>
          <div class="resumen" style="margin-top:8px"><dt>Equipo</dt><dd>${html(S.tipo_equipo)}</dd></div>
          <div class="resumen" style="margin-top:8px"><dt>Falla</dt><dd>${html(S.falla)}</dd></div>
        </dl>
        <button class="btn-primario" id="btn-enviar" onclick="enviar()">Confirmar y Enviar</button>
        <button class="btn-sec" style="display:block;width:100%;margin-top:10px;text-align:center" onclick="paso3_falla()">← Modificar</button>
      </div>
    </div>
  `);
}

async function enviar() {
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Enviando…';
  try {
    const res = await fetch('/api/reportar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: S.nombre,
        estacion_id: S.estacion_id,
        tipo_equipo: S.tipo_equipo,
        descripcion: S.falla,
      }),
    }).then(r => r.json());

    if (res.ok) {
      pantalla_exito(res.caso_id);
    } else {
      btn.disabled = false;
      btn.textContent = 'Confirmar y Enviar';
      alert('Error al enviar: ' + (res.error || 'inténtalo de nuevo'));
    }
  } catch {
    btn.disabled = false;
    btn.textContent = 'Confirmar y Enviar';
    alert('Sin conexión. Revisa tu red e inténtalo de nuevo.');
  }
}

// ═══════════════════════════════════════════════════════════
// Pantalla de éxito
// ═══════════════════════════════════════════════════════════
function pantalla_exito(caso_id) {
  // Limpiar selecciones para el próximo reporte
  _falla_seleccionada = '';
  S.audio_blob = null; S.audio_texto = '';
  S.estacion_id = null; S.estacion_nombre = '';
  S.tipo_equipo = ''; S.falla = '';

  render(`
    <div class="exito">
      <div class="icono-ok">✅</div>
      <h2>Reporte enviado</h2>
      <p>El equipo de Soporte TI ya fue notificado y tomará el caso a la brevedad.</p>
      <div class="caso-badge">Caso #${caso_id}</div>
      <p style="font-size:13px;color:#94a3b8;margin-top:4px">Guarda este número por si necesitas hacer seguimiento.</p>
      <button class="btn-primario" style="max-width:280px;margin:20px auto 0"
        onclick="paso1_estacion()">Reportar otro problema</button>
    </div>
  `);
}

// ═══════════════════════════════════════════════════════════
// Inicio
// ═══════════════════════════════════════════════════════════
window.addEventListener('load', () => {
  if (S.nombre) paso1_estacion();
  else paso0_nombre();
});
</script>
</body>
</html>
